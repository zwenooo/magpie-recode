<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ReCode 面板</title>
<style>
  :root {
    --bg: #f6f6f7; --card: #fff; --fg: #1c1c1e; --muted: #6b7280; --faint: #9ca3af; --line: #e5e7eb;
    --accent: #0f766e; --accent-soft: #e6f2f1; --green: #16a34a; --red: #dc2626; --amber: #d97706;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
    --code: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  :root.dark { color-scheme: dark; --bg: #1c1c1e; --card: #26262a; --fg: #ececf1; --muted: #a1a1aa; --faint: #71717a; --line: #3f3f46; --accent: #2bb3a3; --accent-soft: #1f3533; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font); }
  main { padding: 20px 24px 40px; max-width: 1180px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header img { width: 22px; height: 22px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; margin: 0; font-weight: 600; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  code, .mono { font-family: var(--code); font-size: 12px; }
  button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 4px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg, #fff); }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); border-radius: 3px; }
  button.link:hover { text-decoration: underline; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; background: var(--faint); }
  .chip.ok .dot, .dot.ok { background: var(--green); }
  .chip.warn .dot, .dot.warn { background: var(--amber); }
  .chip.bad .dot, .dot.bad { background: var(--red); }
  .dot.info { background: var(--faint); }
  .say { margin-top: 8px; font-size: 12px; min-height: 18px; }
  .say.err { color: var(--red); }
  .tip { cursor: help; border-bottom: 1px dotted var(--faint); }

  /* the verdict: one sentence, what is followed, and what isn't */
  .verdict { margin: 6px 0 22px; }
  .verdict .head { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
  .verdict .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: #fff; background: var(--green); flex: none; }
  .verdict.warn .mark { background: var(--amber); }
  .verdict.bad .mark { background: var(--red); }
  .verdict .facts { margin: 4px 0 0 34px; color: var(--muted); }
  .verdict .facts b { color: var(--fg); font-weight: 500; }
  .issues { list-style: none; margin: 14px 0 0 34px; padding: 0; display: grid; gap: 10px; }
  .issues li { display: grid; grid-template-columns: 7px 1fr; column-gap: 10px; align-items: baseline; }
  .issues li .dot { transform: translateY(-1px); }
  .issues .what { font-weight: 500; }
  .issues .who { color: var(--muted); }
  .issues .who button.link { font-family: var(--code); font-size: 12px; margin-right: 6px; }
  .issues .why { grid-column: 2; color: var(--muted); font-size: 12px; }

  /* the accounts */
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; border-radius: 0; padding: 3px 10px; font-size: 12px; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; background: var(--bg); }
  tr.acct { cursor: pointer; }
  tr.acct:hover td, tr.acct.open td { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
  tr.acct.open td { border-bottom-color: transparent; }
  td.id { font-family: var(--code); font-size: 12px; font-weight: 600; }
  td.chev { width: 28px; color: var(--faint); text-align: center; padding-left: 0; padding-right: 8px; }
  td.chev span { display: inline-block; transition: transform .15s; }
  tr.open td.chev span { transform: rotate(90deg); }
  .yes { color: var(--green); font-weight: 600; }
  .yes small { color: var(--faint); font-weight: 400; font-size: 12px; margin-left: 4px; }
  .pills { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; line-height: 18px; }
  .pill.bad { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
  .pill.warn { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
  .pill.info, .pill.off { color: var(--muted); background: color-mix(in srgb, var(--faint) 16%, transparent); }
  .pill code { font-size: 11.5px; }
  tr.detail td { white-space: normal; background: color-mix(in srgb, var(--accent-soft) 35%, var(--card)); padding: 4px 16px 16px 24px; }
  .empty td { color: var(--muted); padding: 18px 12px; text-align: center; }

  dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 18px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .names { display: flex; flex-wrap: wrap; gap: 4px; }
  .names code { background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
  .names code.miss { border-color: var(--red); color: var(--red); }
  .names code.extra { border-color: var(--amber); color: var(--amber); }
  .acts { margin-top: 10px; display: flex; gap: 14px; }

  /* what is around the accounts: plain columns, no boxes */
  .about { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 0 48px; margin-top: 30px; }
  .about section { padding: 14px 0 18px; border-top: 1px solid var(--line); }
  .about .top { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
  details.log { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  details.log summary { cursor: pointer; font-weight: 600; }
  details.log summary span { font-weight: 400; color: var(--muted); }
  .log pre { font-family: var(--code); font-size: 12px; white-space: pre-wrap; max-height: 320px; overflow: auto; margin: 8px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="">
    <h1>ReCode</h1>
    <span id="state" class="chip"><span class="dot"></span><span>读取中…</span></span>
    <span class="grow"></span>
    <span id="at" class="faint"></span>
    <button id="refresh">刷新</button>
    <button id="check">立即检查</button>
    <button id="sync" class="primary">立即同步</button>
  </header>
  <div id="say" class="say muted"></div>
  <div id="verdict" class="verdict"></div>

  <div class="bar">
    <h2>账号</h2>
    <span class="seg" id="seg"></span>
    <span class="grow"></span>
    <span class="faint">和 Claude Code（主配置）比较，点一行看细节</span>
  </div>
  <table>
    <thead><tr>
      <th>账号</th><th>最近使用</th>
      <th><span class="tip" title="magpie Library 里，这个账号行勾上的 MCP 和 skill，和 claude 行一样多才算跟上">Library</span></th>
      <th><span class="tip" title="账号 .claude.json 里的 MCP server：有没有 magpie hub，和 Claude Code 的比少了或多了哪些">MCP</span></th>
      <th><span class="tip" title="账号 skills 文件夹里的 skill，和 ~/.claude/skills 比">Skill</span></th>
      <th><span class="tip" title="账号的 CLAUDE.md（用户说明 / 记忆），和 ~/.claude/CLAUDE.md 比">CLAUDE.md</span></th>
      <th><span class="tip" title="会话（projects，含各项目的记忆 memory/）和 /rewind 检查点（file-history）是否链到共享文件夹">会话</span></th>
      <th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="about">
    <section id="main"></section>
    <section id="shared"></section>
    <section id="runner"></section>
    <section id="opts"></section>
  </div>

  <details class="log" id="logBox">
    <summary>日志 <span id="logCount"></span></summary>
    <pre id="log"></pre>
  </details>
</main>
<script>
"use strict"
const TOKEN = "__RECODE_TOKEN__"
const $ = (id) => document.getElementById(id)
const open = new Set()
let last = null
let timer = 0
let only = false // show only the accounts that differ

// the theme magpie's page handed over in the address
try {
  const m = /theme=([^&]+)/.exec(location.hash)
  if (m) {
    const t = JSON.parse(decodeURIComponent(m[1]))
    if (t.dark) document.documentElement.classList.add("dark")
    for (const [k, v] of Object.entries(t.tokens || {})) if (v) document.documentElement.style.setProperty("--" + k, v)
  }
} catch {}

function el(tag, cls, text) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text !== undefined) e.textContent = text
  return e
}

async function api(path, body) {
  const r = await fetch(path, body === undefined
    ? { headers: { "X-ReCode-Token": TOKEN } }
    : { method: "POST", headers: { "X-ReCode-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body) })
  const j = await r.json().catch(() => ({}))
  if (!r.ok && r.status !== 202) throw new Error(j.error || `${r.status}`)
  return j
}

function ago(ms) {
  if (!ms) return "—"
  const s = Math.round((Date.now() - ms) / 1000)
  if (s < 60) return "刚刚"
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`
  if (s < 86400) return `${Math.floor(s / 3600)} 小时前`
  return `${Math.floor(s / 86400)} 天前`
}
const when = (ms) => (ms ? new Date(ms).toLocaleString() : "—")

// few is a short list of names, or how many when it's long
const few = (xs) => (xs.length <= 2 ? xs.join("、") : `${xs.length} 个`)

// A finding is something an account differs in: kind (bad, warn, info or
// off), its words in the table (cell), the headline it groups under in the
// verdict (what) and why it matters (why). An area with no findings is the
// same as Claude Code's.
const F = (kind, cell, what, why) => ({ kind, cell, what, why })
const SERIOUS = { bad: 3, warn: 2, info: 1, off: 0 }

function judge(a, s) {
  const out = { link: [], library: [], mcp: [], skills: [], md: [], sessions: [] }
  if (a.link !== "ok") out.link.push(a.link === "missing"
    ? F("bad", "没有链接", "~/.claude-rec-<id> 不存在", "magpie 看不到这个账号；ReCode 下次检查时会建")
    : F("bad", "名字被占用", "~/.claude-rec-<id> 是别的东西", "这个名字是别的文件夹或链接，ReCode 没动它，要你自己挪开"))

  const L = a.library
  if (!L) out.library.push(F("off", "读不到", "读不到 Library", "magpie 的 library.json 不是有效的 JSON"))
  else {
    if (L.mcp[0] !== L.mcp[1] || L.skills[0] !== L.skills[1]) out.library.push(F("bad", `MCP ${L.mcp[0]}/${L.mcp[1]} · skill ${L.skills[0]}/${L.skills[1]}`, "Library 勾选没跟上 claude 行", "ReCode 会把勾选补上并同步；急的话点「立即同步」"))
    if (L.instructions === false) out.library.push(F("bad", "说明没勾", "Library 说明没勾", "claude 行勾了说明，这个账号行没勾"))
  }

  const M = a.mcp
  if (!M) out.mcp.push(F("bad", "读不了", "账号的 .claude.json 读不了", "不是有效的 JSON"))
  else {
    if (M.hub === "missing") out.mcp.push(F("bad", "没有 hub", "没有 magpie hub", "新开的会话里没有 Library 的工具；点「立即同步」写进去"))
    else if (M.hub === "bare") out.mcp.push(F("warn", "裸 /hub", "hub 地址不带账号名", "应为 /hub/" + a.row + "，点「立即同步」改正"))
    else if (M.hub === "other") out.mcp.push(F("warn", "hub 名字不对", "hub 地址不是这个账号的", "应为 /hub/" + a.row + "，点「立即同步」改正"))
    const missing = M.missing.filter((n) => !(n === "magpie" && M.hub !== "ok"))
    if (missing.length) out.mcp.push(F("bad", "缺 " + few(missing), "MCP 缺 " + missing.join("、"), "Claude Code 有、这个账号没有"))
    const dupes = M.dupes || []
    if (dupes.length) out.mcp.push(F("warn", "重复 " + few(dupes), "MCP 重复 " + dupes.join("、"), "Library 里也有、hub 已经给了，账号里直接写的这份是多余的，会出现两套同名工具"))
    const own = M.extra.filter((n) => !dupes.includes(n))
    if (own.length) out.mcp.push(F("info", "+ " + few(own), "MCP 多出 " + own.join("、"), "账号里直接写的，Library 里没有、Claude Code 也没有；不影响跟随，ReCode 不会动它"))
  }

  const S = a.skills
  if (S.missing.length) out.skills.push(F("bad", "缺 " + few(S.missing), "Skill 缺 " + S.missing.join("、"),
    S.notInLibrary.length ? `其中 ${S.notInLibrary.join("、")} 不在 Library 里，ReCode 不会跟随：在资源库里导入它们` : "点「立即同步」补上"))
  if (S.extra.length) out.skills.push(F("info", "+ " + few(S.extra), "Skill 多出 " + S.extra.join("、"), "账号里有、~/.claude/skills 里没有"))

  if (a.claudeMd === "different") out.md.push(F("warn", "不同", "CLAUDE.md 和 Claude Code 的不同", s.options?.followClaudeMd === false ? "跟随 CLAUDE.md 关着" : "ReCode 下次检查时会换成 Claude Code 的（旧的进备份）"))
  else if (a.claudeMd === "missing") out.md.push(F("bad", "没有", "没有 CLAUDE.md", "Claude Code 有，这个账号没有"))
  else if (a.claudeMd === "none") out.md.push(F("off", "都没有", "Claude Code 也没有 CLAUDE.md", ""))

  const P = a.folders.projects, H = a.folders["file-history"]
  if (P === "shared" && H === "shared") {}
  else if (a.waiting.length) out.sessions.push(F("warn", "等空闲", "会话等空闲后共享", "这些文件夹最近有写入（会话还开着），空闲后再合并：" + a.waiting.join("、")))
  else if (P === "elsewhere" || H === "elsewhere") out.sessions.push(F("bad", "链到别处", "会话文件夹链到别处", "projects 或 file-history 是指向别处的链接或文件，ReCode 没动它"))
  else if (s.options?.shareSessions) out.sessions.push(F("warn", "还没共享", "会话还没共享", "ReCode 下次检查时会合并进共享文件夹"))
  else out.sessions.push(F("off", a.own ? `自己的 · ${a.own.sessions}` : "自己的", "会话是账号自己的", "共享会话没开"))
  return out
}

const worst = (fs) => fs.reduce((w, f) => (SERIOUS[f.kind] > SERIOUS[w] ? f.kind : w), "off")
const AREAS = ["library", "mcp", "skills", "md", "sessions"]

function names(list, cls) {
  const box = el("div", "names")
  if (!list.length) box.append(el("span", "faint", "—"))
  for (const n of list) box.append(el("code", cls, n))
  return box
}

function put(dl, k, v) {
  dl.append(el("dt", "", k))
  const d = el("dd")
  d.append(v instanceof Node ? v : document.createTextNode(v))
  dl.append(d)
}

function opener(label, what, id) {
  const b = el("button", "link", label)
  b.onclick = (e) => { e.stopPropagation(); act("/api/open", { what, id }) }
  return b
}

function detail(a) {
  const dl = el("dl")
  put(dl, "文件夹", a.dir)
  put(dl, "Library 行", a.row)
  if (a.mcp) {
    put(dl, "magpie hub", { ok: "有（/hub/" + a.row + "）", bare: "裸 /hub", other: "地址不对", missing: "没有" }[a.mcp.hub])
    put(dl, "MCP（账号里的）", names(a.mcp.names))
    if (a.mcp.missing.length) put(dl, "MCP 缺少", names(a.mcp.missing, "miss"))
    if (a.mcp.extra.length) put(dl, "MCP 多出", names(a.mcp.extra, "extra"))
  }
  put(dl, "Skill", `${a.skills.count} 个`)
  if (a.skills.missing.length) put(dl, "Skill 缺少", names(a.skills.missing, "miss"))
  if (a.skills.extra.length) put(dl, "Skill 多出", names(a.skills.extra, "extra"))
  put(dl, "CLAUDE.md", { same: "和 Claude Code 的一样", different: "和 Claude Code 的不一样", missing: "没有", none: "Claude Code 也没有" }[a.claudeMd])
  const fs = { shared: "链到共享文件夹", own: "账号自己的文件夹", elsewhere: "指向别处", none: "还没有" }
  put(dl, "会话 projects", fs[a.folders.projects] + (a.own ? ` · ${a.own.projects} 个项目，${a.own.sessions} 个会话，${a.own.memory} 条记忆` : ""))
  put(dl, "检查点 file-history", fs[a.folders["file-history"]])
  const td = el("td")
  td.colSpan = 8
  const acts = el("div", "acts")
  acts.append(opener("打开账号文件夹", "account", a.id))
  td.append(dl, acts)
  const tr = el("tr", "detail")
  tr.append(td)
  return tr
}

// cell is a check when an area is the same as Claude Code's, else a pill
// for each way it differs
function cell(fs, okText) {
  const td = el("td")
  if (!fs.length) {
    const y = el("span", "yes", "✓")
    if (okText) y.append(el("small", "", okText))
    td.append(y)
    return td
  }
  const box = el("span", "pills")
  for (const f of fs) {
    const p = el("span", "pill " + f.kind, f.cell)
    p.title = f.what + (f.why ? "：" + f.why : "")
    box.append(p)
  }
  td.append(box)
  return td
}

function show(id) {
  open.add(id)
  only = false
  draw(last)
  document.querySelector(`tr.acct[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" })
}

function verdict(s, A, J) {
  const v = $("verdict")
  v.replaceChildren()
  const n = A.length
  const kinds = J.map((j) => worst([...j.link, ...AREAS.flatMap((k) => j[k])]))
  const behind = kinds.filter((k) => k === "bad" || k === "warn").length
  const level = kinds.includes("bad") ? "bad" : behind ? "warn" : "ok"
  v.className = "verdict " + level
  const head = el("div", "head")
  head.append(el("span", "mark", level === "ok" ? "✓" : "!"),
    el("span", "", !n ? `${s.recRoot} 下没有 ReCode 账号` : level === "ok" ? `${n} 个账号都跟上了 Claude Code` : `${n} 个账号里 ${behind} 个没跟上 Claude Code`))
  v.append(head)

  const facts = el("div", "facts")
  const bits = []
  const b = (t) => { const x = el("b", "", t); return x }
  if (s.library) bits.push([`跟随 `, b(`${s.library.claude.mcp.length} 个 MCP`), s.library.hub ? "（经 magpie hub）、" : "、", b(`${s.main.skills.length} 个 skill`)])
  if (s.main.claudeMd) bits.push(["CLAUDE.md ", b(`${s.main.claudeMd.lines} 行`)])
  if (s.shared.on) bits.push(["共享 ", b(`${s.shared.sessions} 个会话`), `、${s.shared.memory} 条项目记忆`])
  bits.forEach((parts, i) => { if (i) facts.append(" · "); facts.append(...parts) })
  if (bits.length) v.append(facts)

  // the same finding on several accounts is one line
  const groups = new Map()
  J.forEach((j, i) => {
    for (const f of [...j.link, ...AREAS.flatMap((k) => j[k])]) {
      if (f.kind === "off") continue
      const key = f.kind + "\0" + f.what + "\0" + f.why
      if (!groups.has(key)) groups.set(key, { ...f, ids: [] })
      groups.get(key).ids.push(A[i].id)
    }
  })
  const list = [...groups.values()].sort((x, y) => SERIOUS[y.kind] - SERIOUS[x.kind] || y.ids.length - x.ids.length)
  if (!list.length) return
  const ul = el("ul", "issues")
  for (const g of list) {
    const li = el("li")
    const line = el("div")
    line.append(el("span", "what", g.what), el("span", "who", g.ids.length === n && n > 1 ? " · 所有账号" : ` · ${g.ids.length} 个账号：`))
    if (!(g.ids.length === n && n > 1)) {
      const who = line.lastChild
      for (const id of g.ids) { const x = el("button", "link", id); x.title = "看这个账号的细节"; x.onclick = () => show(id); who.append(x) }
    }
    li.append(el("span", "dot " + g.kind), line)
    if (g.why) li.append(el("div", "why", g.why))
    ul.append(li)
  }
  v.append(ul)
}

function draw(s) {
  last = s
  const f = s.follower
  const st = $("state")
  st.replaceChildren()
  const running = f && !f.refused
  st.className = "chip " + (!f ? "bad" : f.refused ? "bad" : f.syncing || f.busy ? "warn" : "ok")
  st.append(el("span", "dot"), el("span", "", !f ? "跟随器没在运行" : f.refused ? f.refused : f.syncing ? "正在同步 Library…" : f.busy ? "正在检查…" : "运行中"))
  $("at").textContent = "更新于 " + new Date(s.at).toLocaleTimeString()
  $("sync").disabled = !running || f.syncing
  $("check").disabled = !running || f.busy

  const A = s.accounts
  const J = A.map((a) => judge(a, s))
  verdict(s, A, J)

  const differs = J.map((j) => [...j.link, ...AREAS.flatMap((k) => j[k])].some((x) => x.kind !== "off"))
  const nd = differs.filter(Boolean).length
  if (!nd) only = false
  const seg = $("seg")
  seg.replaceChildren()
  seg.hidden = !nd
  for (const [on, label] of [[false, `全部 ${A.length}`], [true, `有出入 ${nd}`]]) {
    const b = el("button", only === on ? "on" : "", label)
    b.onclick = () => { only = on; draw(last) }
    seg.append(b)
  }

  const body = $("rows")
  body.replaceChildren()
  A.forEach((a, i) => {
    if (only && !differs[i]) return
    const j = J[i]
    const tr = el("tr", "acct" + (open.has(a.id) ? " open" : ""))
    tr.dataset.id = a.id
    const id = el("td", "id", a.id)
    if (j.link.length) { id.append(" "); const c = cell(j.link); id.append(...c.childNodes) }
    const used = el("td", "muted", ago(a.lastUsed))
    used.title = when(a.lastUsed)
    tr.append(id, used,
      cell(j.library, "跟上"), cell(j.mcp), cell(j.skills, String(a.skills.count)), cell(j.md), cell(j.sessions, "共享"))
    const chev = el("td", "chev")
    chev.append(el("span", "", "›"))
    tr.append(chev)
    tr.onclick = () => { open.has(a.id) ? open.delete(a.id) : open.add(a.id); draw(last) }
    body.append(tr)
    if (open.has(a.id)) body.append(detail(a))
  })
  if (!body.children.length) { const tr = el("tr", "empty"); const td = el("td", "", A.length ? "没有和 Claude Code 不同的账号" : `${s.recRoot} 下没有账号`); td.colSpan = 8; tr.append(td); body.append(tr) }

  const top = (box, title, ...acts) => {
    const t = el("div", "top")
    t.append(el("h2", "", title), ...acts)
    box.replaceChildren(t)
  }

  const M = s.main
  const main = $("main")
  top(main, "Claude Code（主配置）", opener("打开 ~/.claude", "main"))
  const dm = el("dl")
  put(dm, "文件夹", M.dir)
  put(dm, "MCP", M.mcp ? names(M.mcp) : "~/.claude.json 读不了")
  if (s.library) put(dm, "Library", `${s.library.hub ? "hub 模式（MCP 经 magpie hub 提供）" : "MCP 直接写进各 agent"} · claude 行勾了 ${s.library.claude.mcp.length} 个 MCP、${s.library.claude.skills.length} 个 skill${s.library.claude.instructions ? "、说明" : ""}`)
  put(dm, "Skill", `${M.skills.length} 个` + (s.mainNotInLibrary?.length ? `，其中 ${s.mainNotInLibrary.length} 个不在 Library 里（${s.mainNotInLibrary.join("、")}），不会跟随到账号` : ""))
  put(dm, "CLAUDE.md", M.claudeMd ? `${M.claudeMd.lines} 行 · 更新于 ${when(M.claudeMd.mtime)}` : "没有")
  put(dm, "会话", `${M.sessions.projects} 个项目，${M.sessions.sessions} 个会话（Claude Code 自己的，不和账号共享）`)
  main.append(dm)

  const S = s.shared
  const sh = $("shared")
  top(sh, "共享文件夹" + (S.on ? "" : "（共享会话没开）"), opener("打开", "shared"),
    ...(S.conflicts ? [opener("打开冲突", "conflicts")] : []), ...(S.backups ? [opener("打开备份", "backups")] : []))
  const ds = el("dl")
  put(ds, "位置", S.dir)
  put(ds, "会话", `${S.projects} 个项目，${S.sessions} 个会话`)
  put(ds, "项目记忆", `${S.memory} 条（projects/<项目>/memory/）`)
  put(ds, "冲突", S.conflicts ? `${S.conflicts} 个文件（合并时内容不同、留下的另一份）` : "没有")
  put(ds, "备份", S.backups ? `${S.backups} 个文件（被替换前的 CLAUDE.md）` : "没有")
  sh.append(ds)

  const r = $("runner")
  top(r, "后台")
  const dr = el("dl")
  if (f) {
    put(dr, "上次检查", f.lastTick ? `${when(f.lastTick)}（每 ${Math.round(f.every / 1000)} 秒一次）` : "还没有")
    put(dr, "上次同步", f.lastSync ? `${when(f.lastSync.at)} · ${f.lastSync.ok ? "成功" : "失败"} · ${Math.round(f.lastSync.ms / 1000)} 秒` : "这次启动后还没同步过")
    if (f.lastSync && !f.lastSync.ok) put(dr, "失败原因", el("span", "mono", f.lastSync.out))
    put(dr, "欠着的同步", f.owed ? (f.holdUntil ? `有，失败后等到 ${when(f.holdUntil)} 再试` : "有，下次检查时做") : "没有")
    put(dr, "magpie 命令行", f.magpie || "还没找到")
  } else put(dr, "状态", "这个 magpie 里跟随器没在运行")
  r.append(dr)

  const o = $("opts")
  top(o, "选项", el("span", "faint", "在「插件」页 → ReCode → 选项里改"))
  const dop = el("dl")
  const O = s.options || {}
  const yes = (v, d) => ((v ?? d) ? "开" : "关")
  put(dop, "跟随 Library", yes(O.follow, true))
  put(dop, "共享会话", yes(O.shareSessions, false))
  put(dop, "跟随 CLAUDE.md", yes(O.followClaudeMd, true))
  put(dop, "检查间隔", `${(O.every || 5000) / 1000} 秒`)
  put(dop, "空闲多久才合并", `${O.quietMinutes ?? 10} 分钟`)
  put(dop, "面板端口", String(O.port || 3587))
  o.append(dop)

  const ev = f ? [...f.events].reverse() : []
  $("logCount").textContent = f ? `· ${ev.length} 条，最新的在上面` : ""
  $("log").textContent = ev.map((e) => `${new Date(e.at).toLocaleString()}  ${e.msg}`).join("\n") || "（这次启动后还没有）"
  schedule(f && (f.busy || f.syncing) ? 2000 : 8000)
}

function say(text, err) {
  const s = $("say")
  s.textContent = text
  s.className = "say " + (err ? "err" : "muted")
}

async function load(fresh) {
  try {
    draw(await api("api/status" + (fresh ? "?fresh=1" : "")))
  } catch (e) {
    say("读不到 ReCode 的状态：" + e.message, true)
    schedule(8000)
  }
}

function schedule(ms) {
  clearTimeout(timer)
  timer = setTimeout(() => { if (document.visibilityState !== "hidden") load(false); else schedule(ms) }, ms)
}

async function act(path, body) {
  try {
    const r = await api(path.replace(/^\//, ""), body)
    if (r.opened) say("已打开 " + r.opened)
    else if (path === "/api/sync") say("开始同步 Library（magpie library sync，可能要几分钟）…")
    else if (path === "/api/check") say("开始检查…")
    setTimeout(() => load(true), 600)
  } catch (e) {
    say(e.message, true)
  }
}

$("refresh").onclick = () => { say(""); load(true) }
$("check").onclick = () => act("/api/check", {})
$("sync").onclick = () => act("/api/sync", {})
load(true)
</script>
</body>
</html>
